{% extends "base.html" %}
{% block title %}Detalle cliente — ePagos{% endblock %}

{% block content %}
<div x-data="clienteDetalleApp()" x-init="init()" x-cloak>

  <!-- Breadcrumb -->
  <nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="/dashboard/clientes">Clientes</a></li>
      <li class="breadcrumb-item active" x-text="cliente ? cliente.apellido + ', ' + cliente.nombre : 'Cargando…'"></li>
    </ol>
  </nav>

  <!-- Loading state -->
  <template x-if="cargando && !cliente">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Cargando datos del cliente…</p>
    </div>
  </template>

  <template x-if="errorGeneral">
    <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span x-text="errorGeneral"></span></div>
  </template>

  <template x-if="cliente">
    <div>
      <!-- Header cliente -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
              <h5 class="fw-bold mb-1" x-text="cliente.apellido + ', ' + cliente.nombre"></h5>
              <div class="text-muted small">
                <i class="bi bi-envelope me-1"></i><span x-text="cliente.email"></span>
                &nbsp;·&nbsp;
                <i class="bi bi-person-badge me-1"></i>DNI <span x-text="cliente.dni"></span>
                &nbsp;·&nbsp;
                CUIT <span x-text="cliente.cuit"></span>
              </div>
              <div class="mt-1">
                <span class="badge bg-light text-dark font-monospace">
                  ID: <span x-text="cliente.identificador_cliente"></span>
                </span>
              </div>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <!-- Sincronizar CBU -->
              <button class="btn btn-outline-primary btn-sm"
                      @click="sincronizarCBU()"
                      :disabled="sincronizando">
                <span x-show="!sincronizando"><i class="bi bi-arrow-repeat me-1"></i>Sincronizar CBU</span>
                <span x-show="sincronizando">
                  <span class="spinner-border spinner-sm me-1" role="status"></span>Sincronizando…
                </span>
              </button>
              <!-- Link adhesión CBU -->
              <button class="btn btn-warning btn-sm"
                      @click="generarLinkAdhesion()"
                      :disabled="generandoLink">
                <span x-show="!generandoLink"><i class="bi bi-link-45deg me-1"></i>Link adhesión CBU</span>
                <span x-show="generandoLink"><span class="spinner-border spinner-sm me-1"></span>Generando…</span>
              </button>
              <!-- Generar cobro -->
              <button class="btn btn-success btn-sm"
                      @click="mostrarFormCobro = !mostrarFormCobro">
                <i class="bi bi-cash-coin me-1"></i>Generar cobro
              </button>
              <!-- Eliminar cliente -->
              <button class="btn btn-outline-danger btn-sm"
                      @click="eliminarCliente()"
                      :disabled="eliminando">
                <span x-show="!eliminando"><i class="bi bi-trash3"></i></span>
                <span x-show="eliminando" class="spinner-border spinner-sm" role="status"></span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Link adhesión generado -->
      <template x-if="linkAdhesion">
        <div class="alert alert-warning d-flex align-items-start gap-3 mt-3">
          <i class="bi bi-link-45deg fs-5 mt-1"></i>
          <div class="w-100">
            <strong>Link de adhesión CBU (sandbox)</strong> — enviáselo al cliente para que ingrese su CBU:
            <div class="input-group mt-2">
              <input type="text" class="form-control form-control-sm font-monospace"
                     :value="linkAdhesion" readonly>
              <button class="btn btn-outline-secondary btn-sm"
                      @click="navigator.clipboard.writeText(linkAdhesion); showToast('Link copiado')">
                <i class="bi bi-clipboard"></i> Copiar
              </button>
            </div>
            <div class="form-text">Una vez que el cliente complete la adhesión, hacé clic en <strong>Sincronizar CBU</strong>.</div>
          </div>
        </div>
      </template>

      <!-- Panel: Generar cobro -->
      <div x-show="mostrarFormCobro" x-transition class="card shadow-sm border-success border-opacity-50 mb-4">
        <div class="card-header bg-success bg-opacity-10 fw-semibold d-flex justify-content-between align-items-center">
          <span><i class="bi bi-cash-coin me-2"></i>Generar cobro</span>
          <button type="button" class="btn-close" @click="mostrarFormCobro = false"></button>
        </div>
        <div class="card-body">
          <template x-if="cliente.cuentas.length === 0">
            <div class="alert alert-warning mb-0">
              <i class="bi bi-exclamation-triangle me-2"></i>
              El cliente no tiene CBU registrados. Primero sincronizá las cuentas desde ePagos.
            </div>
          </template>
          <template x-if="cliente.cuentas.length > 0">
            <form @submit.prevent="generarCobro()">
              <div class="row g-3">
                <div class="col-md-12">
                  <label class="form-label small fw-semibold">Cuenta CBU</label>
                  <select x-model="formCobro.cuenta_id" class="form-select" required>
                    <option value="">— Seleccioná una cuenta —</option>
                    <template x-for="c in cliente.cuentas" :key="c.id">
                      <option :value="c.id"
                              x-text="c.identificador_cuenta + (c.cbu ? ' — ' + c.cbu : '') + (c.alias ? ' (' + c.alias + ')' : '')">
                      </option>
                    </template>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Importe (ARS)</label>
                  <input x-model="formCobro.importe" type="number" step="0.01" min="1"
                         class="form-control" required placeholder="0.00">
                </div>
                <div class="col-md-6">
                  <label class="form-label small fw-semibold">Tipo</label>
                  <select x-model="formCobro.tipo" class="form-select">
                    <option value="inmediato">Inmediato (72 hs)</option>
                    <option value="programado">Programado (fecha futura)</option>
                  </select>
                </div>
                <div class="col-md-6" x-show="formCobro.tipo === 'programado'" x-transition>
                  <label class="form-label small fw-semibold">Fecha de cobro</label>
                  <input x-model="formCobro.fecha_cobro" type="date" class="form-control"
                         :min="hoy">
                </div>
                <div class="col-md-12">
                  <label class="form-label small fw-semibold">Descripción</label>
                  <input x-model="formCobro.descripcion" class="form-control"
                         placeholder="Cobro recurrente">
                </div>
              </div>
              <div class="mt-3 d-flex gap-2 justify-content-end">
                <button type="button" class="btn btn-secondary" @click="mostrarFormCobro = false">Cancelar</button>
                <button type="submit" class="btn btn-success" :disabled="enviandoCobro">
                  <span x-show="enviandoCobro" class="spinner-border spinner-sm me-1" role="status"></span>
                  <span x-text="enviandoCobro ? 'Enviando…' : 'Generar cobro'"></span>
                </button>
              </div>
            </form>
          </template>
        </div>
      </div>

      <!-- Cuentas CBU -->
      <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <span class="fw-semibold">Cuentas CBU/CVU registradas</span>
          <span class="badge bg-primary rounded-pill" x-text="cliente.cuentas.length"></span>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Identificador cuenta</th>
                <th>CBU</th>
                <th>Alias</th>
                <th>Sincronizado</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="cliente.cuentas.length === 0">
                <tr>
                  <td colspan="4" class="text-center text-muted py-3">
                    Sin CBU registrados. Hacé clic en <strong>Sincronizar CBU</strong> para traer las cuentas de ePagos.
                  </td>
                </tr>
              </template>
              <template x-for="c in cliente.cuentas" :key="c.id">
                <tr>
                  <td class="font-monospace small" x-text="c.identificador_cuenta"></td>
                  <td class="font-monospace small" x-text="c.cbu || '—'"></td>
                  <td class="text-muted small" x-text="c.alias || '—'"></td>
                  <td class="text-muted small" x-text="fmtFecha(c.sincronizado_en)"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Historial de cobros del cliente -->
      <div class="card shadow-sm border-0">
        <div class="card-header bg-white fw-semibold d-flex justify-content-between align-items-center">
          <span>Historial de cobros</span>
          <span class="badge bg-secondary rounded-pill" x-text="cliente.cobros.length"></span>
        </div>
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Fecha</th>
                <th>Importe</th>
                <th>Tipo</th>
                <th>Fecha cobro</th>
                <th>Estado</th>
                <th>N° Operación</th>
                <th>Detalle</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="cliente.cobros.length === 0">
                <tr>
                  <td colspan="7" class="text-center text-muted py-4">Sin cobros todavía</td>
                </tr>
              </template>
              <template x-for="co in cliente.cobros" :key="co.id">
                <tr>
                  <td class="small text-muted" x-text="fmtFecha(co.creado_en)"></td>
                  <td class="fw-semibold">$ <span x-text="fmtMonto(co.importe)"></span></td>
                  <td><span class="badge bg-secondary" x-text="co.tipo"></span></td>
                  <td class="small" x-text="co.fecha_cobro ? fmtFechaCorta(co.fecha_cobro) : '—'"></td>
                  <td><span :class="'badge badge-estado-' + co.estado" x-text="co.estado"></span></td>
                  <td class="font-monospace small" x-text="co.numero_operacion"></td>
                  <td class="small text-danger" x-text="co.error || ''"></td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

</div>
{% endblock %}

{% block scripts %}
<script>
function clienteDetalleApp() {
  // Extraer el ID del cliente desde la URL
  const pathParts = window.location.pathname.split('/');
  const clienteId = parseInt(pathParts[pathParts.length - 1]);

  return {
    clienteId,
    cliente: null,
    cargando: false,
    errorGeneral: null,
    sincronizando: false,
    generandoLink: false,
    linkAdhesion: null,
    eliminando: false,
    mostrarFormCobro: false,
    enviandoCobro: false,
    hoy: new Date().toISOString().split('T')[0],
    formCobro: {
      cuenta_id: '',
      importe: '',
      tipo: 'inmediato',
      fecha_cobro: '',
      descripcion: 'Cobro recurrente',
    },

    async init() {
      await this.cargar();
    },

    async cargar() {
      this.cargando = true;
      this.errorGeneral = null;
      try {
        const res = await fetch('/api/clientes/' + this.clienteId);
        if (!res.ok) {
          if (res.status === 404) {
            window.location.href = '/dashboard/clientes';
            return;
          }
          throw new Error('Error al cargar cliente');
        }
        this.cliente = await res.json();
      } catch (e) {
        this.errorGeneral = e.message;
      } finally {
        this.cargando = false;
      }
    },

    async sincronizarCBU() {
      this.sincronizando = true;
      try {
        const res = await fetch('/api/clientes/' + this.clienteId + '/sync_cbu', {
          method: 'POST',
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.error || 'Error al sincronizar CBU', 'error');
          return;
        }
        // Actualizar cuentas en el estado local
        this.cliente.cuentas = data.cuentas;
        const msg = data.nuevas > 0
          ? `CBU sincronizados. ${data.nuevas} cuenta(s) nueva(s).`
          : 'CBU actualizados. No había cuentas nuevas.';
        showToast(msg);
      } catch (e) {
        showToast('Error de red al sincronizar CBU', 'error');
      } finally {
        this.sincronizando = false;
      }
    },

    async generarLinkAdhesion() {
      this.generandoLink = true;
      this.linkAdhesion = null;
      try {
        const res = await fetch('/api/clientes/' + this.clienteId + '/link_adhesion', { method: 'POST' });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Error al generar link', 'error'); return; }
        this.linkAdhesion = data.url;
        showToast('Link generado. Copialo y enviáselo al cliente.');
      } catch (e) {
        showToast('Error de red: ' + e.message, 'error');
      } finally {
        this.generandoLink = false;
      }
    },

    async generarCobro() {
      if (!this.formCobro.cuenta_id) {
        showToast('Seleccioná una cuenta CBU', 'error');
        return;
      }
      this.enviandoCobro = true;
      try {
        const payload = {
          cliente_id: this.clienteId,
          cuenta_id: parseInt(this.formCobro.cuenta_id),
          importe: parseFloat(this.formCobro.importe),
          descripcion: this.formCobro.descripcion || 'Cobro recurrente',
          tipo: this.formCobro.tipo,
        };
        if (this.formCobro.tipo === 'programado' && this.formCobro.fecha_cobro) {
          payload.fecha_cobro = this.formCobro.fecha_cobro;
        }
        const res = await fetch('/api/cobros', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        if (!res.ok) {
          showToast(data.error || 'Error al generar cobro', 'error');
          return;
        }
        // Agregar el cobro al historial local
        const nuevoCobro = {
          id: data.id,
          numero_operacion: data.numero_operacion,
          importe: data.importe,
          descripcion: payload.descripcion,
          tipo: data.tipo,
          fecha_cobro: payload.fecha_cobro || null,
          estado: data.estado,
          id_transaccion: '',
          error: data.error || '',
          creado_en: data.creado_en,
          cuenta_id: payload.cuenta_id,
        };
        this.cliente.cobros.unshift(nuevoCobro);
        this.mostrarFormCobro = false;
        this.formCobro = { cuenta_id: '', importe: '', tipo: 'inmediato', fecha_cobro: '', descripcion: 'Cobro recurrente' };
        const estadoMsg = data.estado === 'error'
          ? `Cobro creado con error: ${data.error}`
          : `Cobro generado. Estado: ${data.estado}`;
        showToast(estadoMsg, data.estado === 'error' ? 'error' : 'success');
      } catch (e) {
        showToast('Error de red al generar cobro', 'error');
      } finally {
        this.enviandoCobro = false;
      }
    },

    async eliminarCliente() {
      if (!confirm(`¿Eliminar a ${this.cliente.apellido}, ${this.cliente.nombre} y todos sus datos? Esta acción no se puede deshacer.`)) return;
      this.eliminando = true;
      try {
        const res = await fetch('/api/clientes/' + this.clienteId, { method: 'DELETE' });
        if (!res.ok) {
          const d = await res.json();
          showToast(d.error || 'Error al eliminar cliente', 'error');
          return;
        }
        showToast('Cliente eliminado');
        setTimeout(() => { window.location.href = '/dashboard/clientes'; }, 1200);
      } catch (e) {
        showToast('Error de red al eliminar', 'error');
        this.eliminando = false;
      }
    },

    fmtFecha(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    },

    fmtFechaCorta(iso) {
      if (!iso) return '—';
      // Handle "YYYY-MM-DD" strings without time component (avoid timezone offset)
      const parts = iso.split('T')[0].split('-');
      if (parts.length === 3) {
        return parts[2] + '/' + parts[1] + '/' + parts[0];
      }
      return new Date(iso).toLocaleDateString('es-AR');
    },

    fmtMonto(v) {
      return Number(v).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },
  };
}
</script>
{% endblock %}
