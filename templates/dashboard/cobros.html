{% extends "base.html" %}
{% block title %}Historial de cobros — ePagos{% endblock %}

{% block content %}
<div x-data="cobrosApp()" x-init="init()" x-cloak>

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <h4 class="fw-bold mb-0"><i class="bi bi-receipt me-2"></i>Historial de cobros</h4>
    <button class="btn btn-sm btn-outline-secondary" @click="cargar(1)" :disabled="cargando">
      <i class="bi bi-arrow-repeat me-1" :class="{'spin': cargando}"></i>Actualizar
    </button>
  </div>

  <!-- Filtros -->
  <div class="card shadow-sm border-0 mb-3">
    <div class="card-body py-2">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <div class="input-group input-group-sm">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" x-model="busqueda" class="form-control"
                   placeholder="Buscar por cliente, N° operación, transacción…"
                   autocomplete="off">
          </div>
        </div>
        <div class="col-md-auto">
          <label class="form-label small mb-0 me-2 fw-semibold">Estado:</label>
          <div class="btn-group btn-group-sm" role="group">
            <button type="button" class="btn"
                    :class="filtroEstado === '' ? 'btn-dark' : 'btn-outline-secondary'"
                    @click="setEstado('')">Todos</button>
            <button type="button" class="btn"
                    :class="filtroEstado === 'acreditado' ? 'btn-success' : 'btn-outline-success'"
                    @click="setEstado('acreditado')">Acreditado</button>
            <button type="button" class="btn"
                    :class="filtroEstado === 'pendiente' ? 'btn-warning text-dark' : 'btn-outline-warning'"
                    @click="setEstado('pendiente')">Pendiente</button>
            <button type="button" class="btn"
                    :class="filtroEstado === 'programado' ? 'btn-primary' : 'btn-outline-primary'"
                    @click="setEstado('programado')">Programado</button>
            <button type="button" class="btn"
                    :class="filtroEstado === 'error' ? 'btn-danger' : 'btn-outline-danger'"
                    @click="setEstado('error')">Error</button>
          </div>
        </div>
        <div class="col-md-auto ms-auto text-muted small">
          <span x-text="resumenPagina"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Cargando -->
  <template x-if="cargando && cobros.length === 0">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2 text-muted">Cargando cobros…</p>
    </div>
  </template>

  <!-- Error -->
  <template x-if="errorMsg">
    <div class="alert alert-danger"><i class="bi bi-exclamation-triangle me-2"></i><span x-text="errorMsg"></span></div>
  </template>

  <!-- Tabla -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive" style="min-height:200px">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Fecha</th>
              <th>Cliente</th>
              <th class="text-end">Importe</th>
              <th>Tipo</th>
              <th>Fecha cobro</th>
              <th>Estado</th>
              <th>N° Operación</th>
              <th>Transacción</th>
              <th>Error</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="cobros.length === 0 && !cargando">
              <tr>
                <td colspan="9" class="text-center text-muted py-5">
                  <span x-show="busqueda || filtroEstado">No hay cobros que coincidan con los filtros aplicados.</span>
                  <span x-show="!busqueda && !filtroEstado">Sin cobros todavía.</span>
                </td>
              </tr>
            </template>
            <template x-for="co in cobros" :key="co.id">
              <tr>
                <td class="small text-muted text-nowrap" x-text="fmtFecha(co.creado_en)"></td>
                <td>
                  <a :href="'/dashboard/clientes/' + co.cliente_id" class="text-decoration-none fw-semibold"
                     x-text="co.cliente_nombre"></a>
                </td>
                <td class="fw-semibold text-end text-nowrap">$ <span x-text="fmtMonto(co.importe)"></span></td>
                <td><span class="badge bg-secondary" x-text="co.tipo"></span></td>
                <td class="small text-nowrap" x-text="co.fecha_cobro ? fmtFechaCorta(co.fecha_cobro) : '—'"></td>
                <td><span :class="'badge badge-estado-' + co.estado" x-text="co.estado"></span></td>
                <td class="font-monospace small" x-text="co.numero_operacion"></td>
                <td class="font-monospace small text-muted" x-text="co.id_transaccion || '—'"></td>
                <td class="small text-danger"
                    style="max-width:180px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap"
                    :title="co.error"
                    x-text="co.error || ''"></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Paginación -->
    <div class="card-footer bg-white d-flex justify-content-between align-items-center flex-wrap gap-2 py-2"
         x-show="totalPaginas > 1 || total > 0">
      <span class="text-muted small" x-text="resumenPagina"></span>
      <nav>
        <ul class="pagination pagination-sm mb-0">
          <li class="page-item" :class="{disabled: pagina <= 1 || cargando}">
            <button class="page-link" @click="cargar(pagina - 1)">&laquo;</button>
          </li>
          <template x-for="p in paginasVisibles" :key="p + '-' + pagina">
            <li class="page-item"
                :class="{active: p === pagina, disabled: p === '…' || cargando}">
              <button class="page-link"
                      @click="typeof p === 'number' && cargar(p)"
                      x-text="p"></button>
            </li>
          </template>
          <li class="page-item" :class="{disabled: pagina >= totalPaginas || cargando}">
            <button class="page-link" @click="cargar(pagina + 1)">&raquo;</button>
          </li>
        </ul>
      </nav>
      <div class="d-flex align-items-center gap-2 small">
        <span class="text-muted">Ir a:</span>
        <input type="number" class="form-control form-control-sm" style="width:70px"
               :min="1" :max="totalPaginas" x-model.number="irAPagina"
               @keydown.enter="cargar(irAPagina)">
        <button class="btn btn-sm btn-outline-secondary" @click="cargar(irAPagina)">Ir</button>
      </div>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<style>
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.8s linear infinite; display: inline-block; }
</style>
<script>
function cobrosApp() {
  return {
    cobros: [],
    total: 0,
    pagina: 1,
    totalPaginas: 1,
    porPagina: 100,
    irAPagina: 1,
    cargando: false,
    errorMsg: null,
    busqueda: '',
    filtroEstado: '',
    _searchTimer: null,

    async init() {
      await this.cargar(1);
      this.$watch('busqueda', () => {
        clearTimeout(this._searchTimer);
        this._searchTimer = setTimeout(() => this.cargar(1), 350);
      });
    },

    setEstado(e) {
      this.filtroEstado = e;
      this.cargar(1);
    },

    async cargar(p) {
      p = Math.max(1, p || 1);
      this.cargando = true;
      this.errorMsg = null;
      try {
        const params = new URLSearchParams({
          page:     p,
          per_page: this.porPagina,
        });
        if (this.filtroEstado) params.set('estado',   this.filtroEstado);
        if (this.busqueda.trim()) params.set('busqueda', this.busqueda.trim());

        const res = await fetch('/api/cobros?' + params.toString());
        if (!res.ok) throw new Error('Error al cargar cobros');
        const data = await res.json();

        this.cobros       = data.cobros;
        this.total        = data.total;
        this.pagina       = data.page;
        this.totalPaginas = data.pages;
        this.irAPagina    = data.page;
      } catch (e) {
        this.errorMsg = e.message;
      } finally {
        this.cargando = false;
      }
    },

    get resumenPagina() {
      if (this.total === 0) return '0 cobros';
      const desde = (this.pagina - 1) * this.porPagina + 1;
      const hasta = Math.min(this.pagina * this.porPagina, this.total);
      return `${desde}–${hasta} de ${this.total.toLocaleString('es-AR')} cobros`;
    },

    get paginasVisibles() {
      const total = this.totalPaginas;
      const cur   = this.pagina;
      if (total <= 7) return Array.from({length: total}, (_, i) => i + 1);
      const pages = [1];
      if (cur > 3) pages.push('…');
      for (let i = Math.max(2, cur - 1); i <= Math.min(total - 1, cur + 1); i++) pages.push(i);
      if (cur < total - 2) pages.push('…');
      pages.push(total);
      return pages;
    },

    fmtFecha(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleDateString('es-AR') + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    },

    fmtFechaCorta(iso) {
      if (!iso) return '—';
      const parts = iso.split('T')[0].split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return new Date(iso).toLocaleDateString('es-AR');
    },

    fmtMonto(v) {
      return Number(v).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    },
  };
}
</script>
{% endblock %}
