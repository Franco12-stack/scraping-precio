<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ePagos Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a2340; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  </style>
</head>
<body>
  <div class="card p-4" style="width: 360px">
    <div class="text-center mb-4">
      <span style="font-size:2.5rem">⚡</span>
      <h4 class="mt-2 fw-bold">ePagos Dashboard</h4>
      <small class="text-muted">Cobros recurrentes</small>
    </div>
    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <div class="mb-3">
        <label class="form-label small fw-semibold">Usuario</label>
        <input name="username" type="text" class="form-control" autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold">Contraseña</label>
        <input name="password" type="password" class="form-control">
      </div>
      <button class="btn btn-primary w-100 fw-semibold">Ingresar</button>
    </form>
  </div>
</body>
</html>
