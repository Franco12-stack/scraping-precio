<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ePagos Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f5f7fa; }
    .sidebar { min-height: 100vh; background: #1a2340; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.08); border-radius: 6px; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.1rem; }
    .stat-card { border: none; border-radius: 12px; }
    .badge-estado-pendiente   { background: #ffc107; color: #000; }
    .badge-estado-acreditado  { background: #198754; color: #fff; }
    .badge-estado-programado  { background: #0d6efd; color: #fff; }
    .badge-estado-error       { background: #dc3545; color: #fff; }
    .badge-estado-enviado     { background: #6c757d; color: #fff; }
    .badge-estado-devuelto    { background: #fd7e14; color: #fff; }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <nav class="col-md-2 d-none d-md-block sidebar py-3 px-3">
      <div class="brand mb-4 ps-2"><i class="bi bi-lightning-charge-fill text-warning"></i> ePagos</div>
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/dashboard' %}active{% endif %}" href="/dashboard">
            <i class="bi bi-speedometer2 me-2"></i>Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if '/clientes' in request.url.path %}active{% endif %}" href="/dashboard/clientes">
            <i class="bi bi-people-fill me-2"></i>Clientes / CBU
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.url.path == '/dashboard/cobros' %}active{% endif %}" href="/dashboard/cobros">
            <i class="bi bi-receipt me-2"></i>Historial cobros
          </a>
        </li>
        <hr class="border-secondary">
        <li class="nav-item">
          <a class="nav-link text-danger" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Salir</a>
        </li>
      </ul>
    </nav>

    <!-- Contenido -->
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
